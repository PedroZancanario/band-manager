<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Band Magener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">🎸 Band Manager</h1>
    <p class="site-subtitle">Manage your favorite bands</p>
  </header>

  <main class="container">
    <section class="form-section">
      <h2 class="section-title">Adicionar banda</h2>
      <form id="band-form" class="band-form">
        <label for="band-name">Nome da banda</label>
        <input type="text" id="band-name" name="name" required>

        <label for="band-genre">Gênero</label>
        <input type="text" id="band-genre" name="genre">

        <label for="band-year">Ano de criação</label>
        <input type="number" id="band-year" name="year" min="1900" max="2100">

        <label for="band-city">Cidade</label>
        <input type="text" id="band-city" name="city">

        <label for="band-status">Status</label>
        <select id="band-status" name="status">
          <option value="ativa">Ativa</option>
          <option value="inativa">Inativa</option>
        </select>

        <button type="submit" class="btn btn-submit" id="submit-button">Adicionar</button>
        <button type="button" class="btn btn-cancel" id="cancel-button" hidden>Cancelar</button>
      </form>
    </section>

    <section class="search-section">
      <label for="search-input" class="section-title">Buscar bandas</label>
      <input type="search" id="search-input" class="search-input" placeholder="Pesquisar banda..." aria-label="Pesquisar bandas">
    </section>

    <section class="cards-section">
      <h2 class="section-title">Bandas</h2>
      <div id="cards-container" class="cards-container"></div>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
